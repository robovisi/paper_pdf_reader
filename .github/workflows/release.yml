name: Release Windows installer

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to release, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Windows installer
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Validate release version
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tagVersion = $env:RELEASE_TAG.TrimStart("v")
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tag must match vMAJOR.MINOR.PATCH, received '$env:RELEASE_TAG'."
          }
          if ($packageVersion -ne $tagVersion) {
            throw "Release tag '$env:RELEASE_TAG' does not match package.json version '$packageVersion'."
          }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build Windows installer
        run: pnpm package:win

      - name: Publish GitHub Release
        shell: pwsh
        run: |
          $artifacts = Get-ChildItem -Path release -File |
            Where-Object { $_.Extension -in @('.exe', '.blockmap', '.yml') } |
            ForEach-Object { $_.FullName }
          if (-not $artifacts) {
            throw "No Windows release artifacts were found in release/."
          }
          $arguments = @(
            'release',
            'create',
            $env:RELEASE_TAG,
            '--repo',
            $env:GITHUB_REPOSITORY,
            '--title',
            "Paper Reader $env:RELEASE_TAG",
            '--generate-notes'
          ) + $artifacts
          & gh @arguments
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
